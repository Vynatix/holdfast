name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jvm-and-android:
    name: JVM + Android (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # com.vynatix:hallmark is not yet on Maven Central; build it into mavenLocal.
      - name: Checkout Hallmark (pinned)
        uses: actions/checkout@v4
        with:
          repository: Vynatix/hallmark
          ref: 79282128cda270ade50a717978712fa21f02da75
          path: hallmark-dep
          persist-credentials: false

      - name: Publish Hallmark to mavenLocal
        run: ./gradlew publishToMavenLocal
        working-directory: hallmark-dep

      - name: Build and test (JVM + Android)
        run: |
          ./gradlew \
            -Pholdfast.includeHallmark=true \
            :holdfast:jvmTest :holdfast:testAndroidHostTest \
            :holdfast-coroutines:jvmTest :holdfast-coroutines:testAndroidHostTest \
            :holdfast-compose:jvmTest :holdfast-compose:testAndroidHostTest \
            :holdfast-testing:jvmTest :holdfast-testing:testAndroidHostTest \
            :holdfast-hallmark:jvmTest :holdfast-hallmark:testAndroidHostTest \
            :holdfast-hallmark-coroutines:jvmTest :holdfast-hallmark-coroutines:testAndroidHostTest \
            --stacktrace

      - name: API check and Dokka
        run: |
          ./gradlew \
            -Pholdfast.includeHallmark=true \
            :holdfast:apiCheck :holdfast:dokkaGenerate \
            :holdfast-coroutines:apiCheck :holdfast-coroutines:dokkaGenerate \
            :holdfast-compose:apiCheck :holdfast-compose:dokkaGenerate \
            :holdfast-testing:apiCheck :holdfast-testing:dokkaGenerate \
            :holdfast-hallmark:apiCheck :holdfast-hallmark:dokkaGenerate \
            :holdfast-hallmark-coroutines:apiCheck :holdfast-hallmark-coroutines:dokkaGenerate \
            --stacktrace

      - name: Lint and static analysis
        run: |
          ./gradlew \
            -Pholdfast.includeHallmark=true \
            :holdfast:detekt :holdfast:ktlintCheck \
            :holdfast-coroutines:detekt :holdfast-coroutines:ktlintCheck \
            :holdfast-compose:detekt :holdfast-compose:ktlintCheck \
            :holdfast-testing:detekt :holdfast-testing:ktlintCheck \
            :holdfast-hallmark:detekt :holdfast-hallmark:ktlintCheck \
            :holdfast-hallmark-coroutines:detekt :holdfast-hallmark-coroutines:ktlintCheck \
            --stacktrace

  ios-and-jvm:
    name: iOS + JVM (macos-15)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # com.vynatix:hallmark is not yet on Maven Central; build it into mavenLocal.
      - name: Checkout Hallmark (pinned)
        uses: actions/checkout@v4
        with:
          repository: Vynatix/hallmark
          ref: 79282128cda270ade50a717978712fa21f02da75
          path: hallmark-dep
          persist-credentials: false

      - name: Publish Hallmark to mavenLocal
        run: ./gradlew publishToMavenLocal
        working-directory: hallmark-dep

      - name: iOS sim arm64 and JVM tests
        run: |
          ./gradlew \
            -Pholdfast.includeHallmark=true \
            :holdfast:iosSimulatorArm64Test :holdfast:jvmTest \
            :holdfast-coroutines:iosSimulatorArm64Test :holdfast-coroutines:jvmTest \
            :holdfast-compose:iosSimulatorArm64Test :holdfast-compose:jvmTest \
            :holdfast-testing:iosSimulatorArm64Test :holdfast-testing:jvmTest \
            :holdfast-hallmark:iosSimulatorArm64Test :holdfast-hallmark:jvmTest \
            :holdfast-hallmark-coroutines:iosSimulatorArm64Test :holdfast-hallmark-coroutines:jvmTest \
            --stacktrace

name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Derive and validate version from tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "Refusing to publish: tag ${REF_NAME} did not parse to a valid SemVer." >&2
            exit 1
          fi
          echo "HOLDFAST_VERSION=${VERSION}" >> "$GITHUB_ENV"

      # Hallmark modules are gated behind -Pholdfast.includeHallmark=true and
      # excluded from the publish set (their hallmark dep is mavenLocal-only).
      - name: Verify build before publish
        run: |
          ./gradlew \
            "-Pholdfast.version=${HOLDFAST_VERSION}" \
            :holdfast:allTests :holdfast-coroutines:allTests :holdfast-compose:allTests \
            :holdfast-testing:allTests \
            :holdfast:apiCheck :holdfast-coroutines:apiCheck :holdfast-compose:apiCheck \
            :holdfast-testing:apiCheck \
            --stacktrace

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
        run: |
          ./gradlew \
            "-Pholdfast.version=${HOLDFAST_VERSION}" \
            publishAndReleaseToMavenCentral \
            --stacktrace --no-configuration-cache
